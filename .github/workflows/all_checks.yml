name: check
on:
  pull_request:
  workflow_dispatch:
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 4 * * 1"
  
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test with ${{ matrix.py }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
      
    if: >- 
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/rerun-precommit'))
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.12"
          - "3.13"
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup python for test ${{ matrix.py }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.py }}
      # Make the companion PR versions available to tox before publishing to PyPI.
      # Remove this step after ruranges 0.2.8 and gtfreader 0.3.1 are released.
      - name: Build backend PR wheels
        if: github.event_name == 'pull_request'
        run: |
          python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/backend-wheels" \
            "git+https://github.com/pyranges/ruranges_py.git@f56d1520e52f34cd68da8908aa6208ab64956f81" \
            "git+https://github.com/pyranges/gtfreader.git@9a5b3d8eb7b30743aea02fc7211586290171d68c"
          echo "PIP_FIND_LINKS=${{ runner.temp }}/backend-wheels" >> "$GITHUB_ENV"
      - name: Install tox
        run: python -m pip install 'tox-gh>=1.2'
      - name: Setup test suite
        run: tox -vv --notest
      - name: Run test suite
        run: tox --skip-pkg-install
